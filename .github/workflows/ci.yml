name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DB_NAME: ci
      DB_USER: ci
      DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]" pyyaml pytest-asyncio httpx
      - name: Unit, API and AI tests (fake LLM, no network)
        working-directory: backend
        run: python -m pytest
      - name: Existing end-to-end tests
        run: python -m pytest tests/e2e -q
      - name: Detection eval on 20 held-out networks (gate on recall)
        run: python evals/detection_eval.py --networks 20 --first-seed 1000 --gate-recall 0.85 --out /tmp/detection.json
      - name: AI eval, rules baseline
        run: python evals/ai_eval.py --mode rules --out /tmp/ai-rules.json
      - name: AI eval, agent (only when a GROQ_API_KEY secret is set)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        if: ${{ env.GROQ_API_KEY != '' }}
        run: python evals/ai_eval.py --mode agent --delay 2 --out /tmp/ai-agent.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
